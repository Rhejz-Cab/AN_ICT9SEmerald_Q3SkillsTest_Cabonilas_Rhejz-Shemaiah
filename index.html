<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Q3 Skills Test</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background-image:url("bg.png");
background-size:cover;
background-position:center;
font-family:Arial, Helvetica, sans-serif;
}

.form-box{
background-color: indianred;
opacity: 80%;
padding:30px;
border-radius:15px;
width:350px;
margin:auto;
margin-top:60px;
color:white;
}

.profile{
width:90px;
border-radius:50%;
display:block;
margin:auto;
margin-bottom:10px;
}
</style>
</head>

<body>
<div class="form-box text-center">

<h2>REGISTRATION</h2>

<p>Please fill out all required fields in the registration form with accurate information.</p>

<img src="myprofile copy.png" class="profile">

<form>

<div class="mb-2">
<input type="text" id="fname" class="form-control" placeholder="First Name">
</div>

<div class="mb-2">
<input type="text" id="lname" class="form-control" placeholder="Last Name">
</div>

<div class="mb-2">
<input type="number" id="age" class="form-control" placeholder="Age">
</div>

<div class="mb-2">
<input type="email" id="email" class="form-control" placeholder="Email">
</div>

<div class="mb-2">
<input type="text" id="username" class="form-control" placeholder="Enter your username">
</div>

<div class="mb-2">
<input type="password" id="password" class="form-control" placeholder="Enter your password">
</div>

<div class="form-check text-start">
<input class="form-check-input" type="checkbox" id="terms">
<label class="form-check-label">
I accept the Terms of Use and Privacy Policy
</label>
</div>

<br>

<button type="button" class="btn btn-primary w-100" onclick="register()">Create my account</button>

<button type="reset" class="btn btn-light w-100 mt-2">Cancel</button>

</form>

<br>

<p id="output"></p>

<a href="https://obmontessoriangeles.orangeapps.ph/oa_school/online_class#" target="_blank">Learn about O.B. Montessori</a>

</div>

<script>


function register(){


let fname = document.getElementById("fname").value;
let lname = document.getElementById("lname").value;
let age = document.getElementById("age").value;
let username = document.getElementById("username").value;


let fullname = fname + " " + lname;



if(fname === "" || lname === "" || username === ""){
alert("Please complete the required fields.");
}
else{

alert("You have been registered successfully!");

document.getElementById("output").innerHTML =
"Welcome " + fullname + "! Your username is " + username + ".";

}

}

</script>

</body>
</html>
